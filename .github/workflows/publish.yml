name: publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish, e.g. v0.3.2
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    concurrency:
      group: npm-${{ inputs.tag }}
      cancel-in-progress: false
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Use the npm version verified in CI
        run: npm install --global npm@12.2.0

      - name: Check release tag and commit
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          import { execFileSync } from 'node:child_process'
          const tag = process.env.RELEASE_TAG ?? ''
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'))
          if (tag !== 'v' + pkg.version) throw new Error('Tag does not match package version')
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim()
          if (git('rev-parse', 'HEAD') !== git('rev-parse', '--verify', 'refs/tags/' + tag + '^{commit}')) {
            throw new Error('Checked-out commit does not match the release tag')
          }
          git('merge-base', '--is-ancestor', 'HEAD', 'origin/main')
          const version = execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim()
          const [major, minor] = version.split('.').map(Number)
          if (major < 11 || (major === 11 && minor < 15)) {
            throw new Error('Staged publishing requires npm 11.15.0 or newer')
          }
          console.log('Verified ' + pkg.name + '@' + pkg.version + ' at ' + git('rev-parse', 'HEAD'))
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Verify package
        run: |
          npm run typecheck
          npm test
          npm run build
          npm run public:check
          npm run package:audit

      - name: Stage package on npm
        run: npm stage publish --access public --tag latest --registry=https://registry.npmjs.org
